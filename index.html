<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Farah Syria Intelligence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&family=Source+Sans+3:wght@300;400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap">
<style>
:root{
  --ground:#17191c; --raise:#1d2024; --line:#2b2f35; --line-soft:#23262b;
  --text:#e7e5e0; --muted:#9da1a9; --faint:#6d727b;
  --accent:#8fb0d6; --signal:#dcd6c8;
  --logo:"Newsreader","Iowan Old Style",Georgia,serif;
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Source Sans 3","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--accent);outline-offset:4px;border-radius:2px}

.app{min-height:100%;display:flex;flex-direction:column;padding-inline:clamp(16px,4vw,48px)}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px;padding-block:22px;border-bottom:1px solid var(--line-soft)}
.mark{font-family:var(--logo);font-size:19px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap}
.mark span{color:var(--faint);letter-spacing:.24em}
.nav{display:flex;flex-wrap:wrap;gap:6px 28px}
.nav button{font-size:15.5px;color:var(--muted);padding-block:4px;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.nav button:hover{color:var(--text)}
.nav button[aria-current="page"]{color:var(--text);border-bottom-color:var(--signal)}

main{flex:1;display:flex;flex-direction:column}
.view{flex:1;display:flex;flex-direction:column}

/* landing */
.home-grid{flex:1;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:center;gap:24px 48px;padding-block:28px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:500}
.home-copy h1{font-family:var(--serif);font-weight:300;font-size:clamp(38px,5vw,60px);line-height:1.04;letter-spacing:-.01em;margin:14px 0 34px;text-wrap:balance}

.enter{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--text);border:1px solid var(--line);padding:11px 22px;border-radius:2px;transition:border-color .2s,background .2s}
.enter:hover{border-color:var(--signal);background:var(--raise)}
.enter span{display:inline-block;margin-left:8px;transition:transform .25s}
.enter:hover span{transform:translateX(4px)}

.globe-wrap{justify-self:center;width:100%;max-width:640px;aspect-ratio:1;position:relative}
.globe-wrap canvas{width:100%;height:100%;display:block}

.clocks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);margin-bottom:8px}
.clock{padding:16px 16px 18px 0;display:flex;flex-direction:column;gap:2px}
.clock + .clock{padding-left:16px;border-left:1px solid var(--line-soft)}
.clock .city{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.clock .time{font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock .time small{font-size:14px;color:var(--faint);margin-left:3px}
.clock .meta{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.clock.home-mkt .city{color:var(--signal)}

/* intro */
@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .rise.d1{animation-delay:.15s}.rise.d2{animation-delay:.3s}.rise.d3{animation-delay:.45s}.rise.d4{animation-delay:.7s}
  @keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
}

/* section pages */
.page{width:100%;max-width:1060px;margin-inline:auto;padding-block:48px 72px}
.page header{display:flex;flex-direction:column;gap:12px;margin-bottom:44px}
.status{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chip{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--signal);border:1px solid color-mix(in srgb,var(--signal) 45%,transparent);padding:3px 9px;border-radius:2px}
.page h1{font-family:var(--serif);font-weight:300;font-size:clamp(34px,4.4vw,50px);line-height:1.08;margin:0;text-wrap:balance}
.group{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 40px;padding-block:26px;border-top:1px solid var(--line)}
.group h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:4px 0 0}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.q{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 8px}
.q .id{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:4px;font-weight:500}
.q .text{font-family:var(--serif);font-size:21px;line-height:1.35;font-weight:300;max-width:60ch}
.q .out{grid-column:2;color:var(--muted);font-size:15.5px;margin-top:5px;max-width:66ch}
.q .out b{font-weight:500;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;font-size:10.5px;margin-right:8px}
.group.carry{border-top-style:dashed}
.group.carry h2{color:var(--faint)}
.group.carry .text{color:var(--muted);font-size:18px}
.note{color:var(--faint);font-size:13px;margin:6px 0 0;grid-column:1;max-width:22ch}

.schema{grid-column:2;overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--raise)}
.schema table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.schema th{text-align:left;font-weight:500;color:var(--text);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.schema td{padding:11px 14px;color:var(--faint);vertical-align:top}
.schema th + th,.schema td + td{border-left:1px solid var(--line-soft)}

.explorer{border-top:1px solid var(--line);padding-block:26px 34px;display:flex;flex-direction:column;gap:22px}
.ex-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 24px}
.ex-head h2{font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--muted);margin:0}
.ex-head .note{margin:0;max-width:none;font-size:14px}
.ex-body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px 40px;align-items:start}
.tiers{display:flex;flex-direction:column;gap:22px}
.tier{display:flex;flex-direction:column;gap:10px;position:relative}
.tier-h{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500}
.tiers.spine{border-left:1px solid var(--line);padding-left:26px;gap:26px}
.tiers.spine .tier::before{content:"";position:absolute;left:-30px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--ground);border:1px solid var(--muted)}
.nodes{display:flex;flex-wrap:wrap;gap:8px}
.node{font-size:15px;line-height:1.3;text-align:left;color:var(--text);background:var(--raise);border:1px solid var(--line);border-radius:2px;padding:9px 14px;transition:border-color .2s,background .2s}
.node:hover{border-color:var(--faint)}
.node.informal{border-style:dashed;background:none;color:var(--muted)}
.node[aria-pressed="true"]{border-color:var(--signal);background:#24272c;color:#fff}
.panel{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 20px);background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:22px 24px 24px}
.panel-tier{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500}
.panel h3{font-family:var(--serif);font-weight:300;font-size:25px;line-height:1.2;margin:6px 0 18px;text-wrap:balance}
.panel dl{margin:0;display:flex;flex-direction:column}
.panel dt{font-size:14px;color:var(--muted);font-weight:500;border-top:1px solid var(--line);padding-top:11px}
.panel dd{margin:2px 0 12px;color:var(--faint);font-size:15px}

.pager{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding-top:22px;margin-top:8px}
.pager button{color:var(--muted);font-size:14px}
.pager button:hover{color:var(--text)}
.pager .lbl{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;color:var(--faint);font-size:12px;padding-block:14px;border-top:1px solid var(--line-soft)}

@media (max-width:860px){
  .home-grid{grid-template-columns:minmax(0,1fr);padding-block:20px}
  .globe-wrap{order:-1;max-width:420px}
  .clocks{grid-template-columns:repeat(3,minmax(0,1fr))}
  .clock{padding-left:0 !important;border-left:0 !important;border-bottom:1px solid var(--line-soft)}
  .group{grid-template-columns:minmax(0,1fr)}
  .ex-body{grid-template-columns:minmax(0,1fr)}
  .panel{position:static}
  .schema,.note{grid-column:1}
  .note{max-width:none}
}
@media (max-width:460px){
  .clocks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mark{font-size:16px}
  .q .text{font-size:18px}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="mark" data-go="home" aria-label="Farah Advisory, home">Farah <span>Advisory</span></button>
    <nav class="nav" aria-label="Sections">
      <button data-go="macro">Macroeconomy</button>
      <button data-go="public">Public Sector</button>
      <button data-go="banking">Banking</button>
      <button data-go="deals">Deals</button>
    </nav>
  </div>

  <main>
    <section class="view" id="view-home">
      <div class="home-grid">
        <div class="home-copy">
          <div class="eyebrow rise">Private &middot; Working draft</div>
          <h1 class="rise d1">Syria Intelligence</h1>
          <button class="enter rise d2" data-go="macro">Enter <span aria-hidden="true">&rarr;</span></button>
        </div>
        <div class="globe-wrap"><canvas id="globe" role="img" aria-label="Globe marking New York, London, Beirut, Damascus and Dubai"></canvas></div>
      </div>
      <div class="clocks rise d4" id="clocks"></div>
    </section>

    <section class="view" id="view-page" hidden><div class="page" id="page"></div></section>
  </main>

  <div class="foot"><span>Farah Advisory &middot; Confidential</span><span id="stamp"></span></div>
</div>

<script>
(function(){
"use strict";

/* ---------- content ---------- */
var ORDER=["macro","public","banking","deals"];
var PAGES={
macro:{title:"Macroeconomy",
 groups:[
  {h:"Currency and prices",qs:[
   ["How has the exchange rate moved over time?","Monthly series, official and parallel-market rates side by side, annotated with policy events."],
   ["How has inflation moved over time?","CPI series with the source named for each period, and a note on how far each source can be trusted."]]},
  {h:"Growth",qs:[
   ["What is GDP growth, and what is driving it?","Annual estimates by source, with a short breakdown of drivers by sector and by inflow (remittances, aid, investment, reconstruction)."]]},
  {h:"Policy",qs:[
   ["What is the current monetary policy?","Stance and toolkit: rate management, liquidity and withdrawal controls, reserves, currency measures."],
   ["What is the current fiscal policy?","Budget size, revenue sources, spending priorities, subsidy and wage decisions, deficit financing."],
   ["Which institutions are setting these policies?","A map of who decides what: central bank, finance ministry, economy ministry, presidency."],
   ["Who are the individuals within them? What are their backgrounds, and what are their tendencies or positioning?","One profile per person: career history, time in post, public statements, reformist or statist leanings, who they answer to."]]},
  {h:"External support",qs:[
   ["What interventions are multilateral and bilateral institutions making?","By institution (IMF, World Bank, Gulf states, Turkey, EU): programmes, amounts committed versus disbursed, conditions attached, and current status."]]}
 ]
},
public:{title:"Public Sector",
 groups:[
  {h:"Institutions",qs:[
   ["What is the map of public sector institutions and ministries today?","An organisational map covering the presidency, ministries, the Syrian sovereign fund, the Syrian Investment Authority (SIA) and other bodies with a say over investment."],
   ["Who are the key stakeholders in each institution?","Named decision-makers per body, with background, time in post, and their practical role in approving or blocking a deal."],
   ["Who surrounds the president?","The informal circle alongside the formal chart: advisers, family and business figures, and the files each one controls."]]},
  {h:"Rules",qs:[
   ["What regulation is relevant for foreign investors?","Investment law, foreign ownership limits, licensing, profit repatriation, tax, land and property rights. What is law on paper versus practice."],
   ["What is the sanctions status?","By jurisdiction (US, EU, UK, UN): what has been lifted, what remains, what is suspended rather than repealed, and the residual compliance risk for an investor."]]},
  {h:"Enforcement",qs:[
   ["What is the state of the judicial system?","Court structure and capacity, contract enforcement, recognition of arbitration, and how disputes with the state are actually resolved."]]}
 ],
 explorer:{h:"Institutional map",note:"Draft list, to be confirmed. Select an institution to open its profile.",spine:true,
  fields:["Mandate","Head","Key stakeholders","Role in a foreign investment","Sources"],
  tiers:[
   {h:"Presidency",nodes:["Presidency","~Inner circle"]},
   {h:"Economic policy",nodes:["Supreme Council for Economic Development","Ministry of Finance","Ministry of Economy and Industry","Central Bank of Syria"]},
   {h:"Investment vehicles",nodes:["Syrian Investment Authority","Sovereign Fund","Syrian Development Fund"]},
   {h:"Sector gatekeepers",nodes:["Ministry of Energy","Ministry of Transport","Ministry of Communications and Technology","Ministry of Tourism","Ports Authority"]},
   {h:"Legal and enforcement",nodes:["Ministry of Justice","Courts","Arbitration"]}],
  start:"Syrian Investment Authority"}
},
banking:{title:"Banking",
 groups:[
  {h:"Landscape",qs:[
   ["What is the banking landscape, and which banks are privately owned versus publicly owned?","Full list of licensed banks by ownership type, with parent groups and foreign shareholders."],
   ["What was the landscape like during the war?","A before-and-after view: which banks exited, were sanctioned, or changed hands, and what that legacy means today."],
   ["For each bank, who is in the leadership, and how long have they been there?","Chair, CEO and key board members per bank, with tenure. Flags pre- and post-transition appointments."]]},
  {h:"Cross-border",qs:[
   ["What correspondent bank connections exist?","Per bank: confirmed correspondent relationships, currencies covered, and SWIFT status."],
   ["Can you send money to a Syrian bank internationally today?","A practical answer by corridor (US, UK, EU, Gulf, Lebanon, Turkey): what works, what it costs, how long it takes, where it fails."]]},
  {h:"Payment rails",qs:[
   ["What are the payment rails: ShamCash, hawala, and other fintech solutions? Which are publicly run and which privately?","One entry per rail: operator and ownership, regulatory status, volumes where known, and what investors and companies actually use."],
   ["What is the status of card network re-entry?","Visa and Mastercard: announcements versus live issuance and acceptance, partner banks, and what works for a foreign cardholder in Syria today."]]}
 ],
 explorer:{h:"Bank roster",note:"Draft roster, to be confirmed. Select a bank to open its profile.",
  fields:["Ownership and shareholders","Chair and CEO","In post since","Correspondent banks","Sanctions history","During the war"],
  tiers:[
   {h:"State-owned",nodes:["Commercial Bank of Syria","Real Estate Bank","Agricultural Cooperative Bank","Industrial Bank","Popular Credit Bank","Savings Bank"]},
   {h:"Private",nodes:["Bank of Syria and Overseas","Banque Bemo Saudi Fransi","Arab Bank Syria","International Bank for Trade and Finance","Bank of Jordan Syria","Fransabank Syria","Syria Gulf Bank","Qatar National Bank Syria","Sharq Bank"]},
   {h:"Private Islamic",nodes:["Syria International Islamic Bank","Cham Bank","Al Baraka Bank Syria","National Islamic Bank"]}],
  start:"Commercial Bank of Syria"}
},
deals:{title:"Deals",
 groups:[
  {h:"Deal flow",qs:[
   ["Which deals have been announced?","A running log of every announced investment, MoU and concession, with date, headline value and source."],
   ["Which have closed?","Each announced deal tracked through stages, with evidence of closing: signed agreements, funds moved, work started."]]},
  {h:"Closed deals",qs:[
   ["Who are the investors?","Investor profiles: origin, type (sovereign, strategic, family group, diaspora), prior Syria exposure, and who fronted the deal."],
   ["What are the industries of the targets?","Closed deals by sector and by value, to show where capital is concentrating and where it is absent."]]}
 ],
 carry:["Key individuals behind the deals: recurring names, advisers and intermediaries"],
 schema:{label:"Proposed deal tracker",cols:["Date announced","Target or project","Industry","Investor(s)","Investor origin","Size","Stage","Source"]}
}};

/* ---------- routing ---------- */
var home=document.getElementById("view-home"),pv=document.getElementById("view-page"),pageEl=document.getElementById("page");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function renderPage(k){
  var p=PAGES[k],L=k.charAt(0).toUpperCase(),n=0,h="";
  h+='<header><div class="status"><span class="chip">Draft outline</span><span class="eyebrow">For discussion Tuesday 22 September</span></div><h1>'+p.title+'</h1></header>';
  p.groups.forEach(function(g){
    h+='<div class="group"><h2>'+g.h+'</h2><ul class="qs">';
    g.qs.forEach(function(q){n++;h+='<li class="q"><span class="id">'+L+n+'</span><span class="text">'+esc(q[0])+'</span><span class="out"><b>Output</b>'+esc(q[1])+'</span></li>';});
    h+='</ul></div>';
  });
  if(p.carry){
    h+='<div class="group carry"><div><h2>Keep or drop</h2><p class="note">From the earlier outline, not in this week&rsquo;s list.</p></div><ul class="qs">';
    p.carry.forEach(function(c){h+='<li class="q"><span class="id">&mdash;</span><span class="text">'+esc(c)+'</span></li>';});
    h+='</ul></div>';
  }
  if(p.explorer){
    var x=p.explorer;
    h+='<div class="explorer"><div class="ex-head"><h2>'+x.h+'</h2><p class="note">'+x.note+'</p></div><div class="ex-body"><div class="tiers'+(x.spine?' spine':'')+'">';
    x.tiers.forEach(function(t){
      h+='<div class="tier"><div class="tier-h">'+t.h+'</div><div class="nodes">';
      t.nodes.forEach(function(nm){var inf=nm.charAt(0)==="~";if(inf)nm=nm.slice(1);
        h+='<button class="node'+(inf?' informal':'')+'" data-node="'+esc(nm)+'" data-tier="'+esc(t.h)+'">'+esc(nm)+'</button>';});
      h+='</div></div>';
    });
    h+='</div><aside class="panel" id="panel" aria-live="polite"></aside></div></div>';
  }
  if(p.schema){
    h+='<div class="group"><div><h2>'+p.schema.label+'</h2><p class="note">Columns only. No entries until sources are agreed.</p></div><div class="schema"><table><thead><tr>';
    p.schema.cols.forEach(function(c){h+='<th>'+esc(c)+'</th>';});
    h+='</tr></thead><tbody><tr>';
    p.schema.cols.forEach(function(){h+='<td>&mdash;</td>';});
    h+='</tr></tbody></table></div></div>';
  }
  var i=ORDER.indexOf(k),pr=ORDER[i-1],nx=ORDER[i+1];
  h+='<div class="pager">'+(pr?'<button data-go="'+pr+'"><span class="lbl">Previous</span>&larr; '+PAGES[pr].title+'</button>':'<button data-go="home"><span class="lbl">Back</span>&larr; Overview</button>')+
     (nx?'<button data-go="'+nx+'" style="text-align:right"><span class="lbl">Next</span>'+PAGES[nx].title+' &rarr;</button>':'<span></span>')+'</div>';
  pageEl.innerHTML=h;
  if(p.explorer)pick(k,picked[k]||p.explorer.start);
}
var picked={};
function pick(k,name){
  var x=PAGES[k].explorer,panel=document.getElementById("panel");if(!x||!panel)return;
  picked[k]=name;var tier="",inf=false;
  pageEl.querySelectorAll(".node").forEach(function(b){var on=b.getAttribute("data-node")===name;
    b.setAttribute("aria-pressed",on?"true":"false");if(on){tier=b.getAttribute("data-tier");inf=b.classList.contains("informal");}});
  var h='<div class="panel-tier">'+esc(tier)+(inf?' &middot; informal':'')+'</div><h3>'+esc(name)+'</h3><dl>';
  x.fields.forEach(function(f){h+='<dt>'+esc(f)+'</dt><dd>To be completed</dd>';});
  panel.innerHTML=h+'</dl>';
}
var current="home";
function go(k,push){
  if(k!=="home"&&!PAGES[k])k="home";
  current=k;
  home.hidden=k!=="home"; pv.hidden=k==="home";
  if(k!=="home")renderPage(k);
  document.querySelectorAll(".nav button").forEach(function(b){
    if(b.getAttribute("data-go")===k)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
  });
  if(push!==false){try{history.replaceState(null,"","#"+k)}catch(e){}}
  window.scrollTo(0,0);
  if(k==="home")startGlobe();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-go]");if(b){go(b.getAttribute("data-go"));return;}
  var n=e.target.closest("[data-node]");if(n)pick(current,n.getAttribute("data-node"));
});
window.addEventListener("hashchange",function(){var k=location.hash.slice(1);if(k&&k!==current)go(k,false);});

/* ---------- clocks ---------- */
var CITIES=[
 {n:"New York",tz:"America/New_York",lat:40.71,lon:-74.01,ax:"right",dx:-10,dy:4},
 {n:"London",tz:"Europe/London",lat:51.51,lon:-0.13,ax:"left",dx:9,dy:-8},
 {n:"Beirut",tz:"Asia/Beirut",lat:33.89,lon:35.50,ax:"right",dx:-9,dy:6},
 {n:"Damascus",tz:"Asia/Damascus",lat:33.51,lon:36.29,ax:"left",dx:9,dy:-9,home:true},
 {n:"Dubai",tz:"Asia/Dubai",lat:25.20,lon:55.27,ax:"left",dx:7,dy:15}
];
var clocksEl=document.getElementById("clocks");
CITIES.forEach(function(c,i){
  var d=document.createElement("div");d.className="clock"+(c.home?" home-mkt":"");
  d.innerHTML='<span class="city">'+c.n+'</span><span class="time" id="ct'+i+'">--:--</span><span class="meta" id="cm'+i+'">&nbsp;</span>';
  clocksEl.appendChild(d);
});
function fmt(tz,opt){try{opt.timeZone=tz;return new Intl.DateTimeFormat("en-GB",opt)}catch(e){return null}}
CITIES.forEach(function(c){
  c.fT=fmt(c.tz,{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
  c.fD=fmt(c.tz,{weekday:"short",day:"numeric",month:"short"});
  c.fO=fmt(c.tz,{timeZoneName:"shortOffset",hour:"numeric"});
});
function tick(){
  var now=new Date();
  CITIES.forEach(function(c,i){
